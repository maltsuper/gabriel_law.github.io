            /* Style the list */
        ul.breadcrumb {
        padding: 10px 16px;
        list-style: none;

        }

            /* Display list items side by side */
            ul.breadcrumb li {
            display: inline;
            font-size: 18px;
            }

            /* Add a slash symbol (/) before/behind each list item */
            ul.breadcrumb li+li:before {
            padding: 8px;
            color: black;
            content: "/\00a0";
            }

            /* Add a color to all links inside the list */
            ul.breadcrumb li a {
            color: #868686;
            text-decoration: none;
            }

            /* Add a color on mouse-over */
            ul.breadcrumb li a:hover {
            color: #001930;
            text-decoration: underline;
            }


        body { font-family: 'Bebas Neue', Arial, sans-serif; 
        padding: 40px; 
        background: #FFFFFF; 
    }
        h1 { 
            color: #333;
             }

        p { font-family: 'Gruppo', Arial, sans-serif; 
        padding: 20px; 
            }
	
.album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        .album {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .album img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .album:hover {
            transform: scale(1.05);
        }

        .album-name {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        .album-score0 {
                    font-size: 1rem;
                    color: #ff2525; 
                }
        
        .album-score1to2 {
                            font-size: 1rem;

                        }

        .album-score3 {

                }

        .album-score4 {
                    font-size: 1rem;

        .album-score5 {

                }

        .album-score6 {
            font-size: 1rem;

        }

        .album-score7 {
                    font-size: 1rem;

        .album-score8 {
            font-size: 1rem;
            color: #77f34a; 
        }

        .album-score9to10 {
            font-size: 1rem;
            color: #00ff26;
        }

        .album-scoretbd {

        }
