<!DOCTYPE html>
<html>

<head>
    <title>LWFL RVWS</title>
    <meta charset="UTF-8">

    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"> 
    <style>
        @font-face {
  font-family: 'Bebas Neue';
  src: url('fonts/BebasNeue-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
        body { font-family: 'Bebas Neue', Arial, sans-serif; 
        padding: 40px; 
        background: #FFFFFF; 
    }
        h1 { 
            color: #333;
             }
	
.album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        .album {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .album img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .album:hover {
            transform: scale(1.05);
        }

        .album-name {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        .album-score {
            font-size: 1rem;
            color: #FFD700; /* gold star-like color for score */
        }


    </style>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

<body>
    <h1 style="text-align: center;">Sgt. Pepper's Lonely Hearts Club Band</h1>
    <p><centre>Sgt. Pepper's Lonely Hearts Club Band</centre></p>







</body>

</html>
